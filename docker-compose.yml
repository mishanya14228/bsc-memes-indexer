version: '3.8'

services:
  rabbitmq:
    image: 'rabbitmq:3-management'
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
  redis:
    image: 'redis:latest'
#    ports:
#      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  four-meme-producer:
    build:
      context: .
      dockerfile: four-meme-producer/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - redis

volumes:
  redis-data: